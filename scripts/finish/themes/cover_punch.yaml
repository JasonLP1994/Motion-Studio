# Motion Studio house finish: punchy editorial / magazine-cover motion (graphic type over 3D). Keeps graphics crisp:
# no distortion, tiny CA, contrast and vibrance up, fine grain, light vignette.
name: cover_punch
description: Punchy editorial finish, crisp graphics, fine grain
white_balance: { temp: 0.0, tint: 0.0 }
exposure: { stops: 0.0 }
highlight_rolloff: { knee: 0.82, strength: 0.3 }
lift_gamma_gain:
  lift:  [0.0, 0.0, 0.0]
  gamma: [1.0, 1.0, 1.0]
  gain:  [1.0, 1.0, 1.0]
split_toning:
  shadow:    [0.0, 0.0, 0.006]
  highlight: [0.004, 0.0, 0.0]
  strength: 0.2
tone_curve: { strength: 0.3, pivot: 0.5 }
vibrance: { vibrance: 0.2, saturation: 1.05, skin_protect: 0.5 }
halation: { threshold: 0.88, radius_frac: 0.01, tint: [1.0, 0.85, 0.7], strength: 0.06 }
distortion: { k: 0.0 }
chromatic_aberration: { amount: 0.0005 }
vignette: { strength: 0.12, feather: 0.65 }
black_point: { lift: 0.0 }
clarity: { amount: 0.15, radius_frac: 0.02 }
grain: { luma: 0.008, chroma: 0.0, size: 0.5, floor: 0.2 }
sharpen: { amount: 0.3, radius_frac: 0.0012, halo: 0.0 }
jpeg: { quality: 100, cycles: 0 }
